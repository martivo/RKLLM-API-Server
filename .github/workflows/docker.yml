name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # ubuntu-22.04-arm is the stable GitHub-hosted ARM64 runner (free for public repos).
    # The image must be built natively on ARM64 — librkllmrt.so is aarch64-only.
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        # default: the runtime pinned in the Dockerfile, published as :latest.
        # The others are trial images published as :rkllm-<version>.
        rkllm: [default, v1.3.0, v1.3.1]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.rkllm == 'default' }}
            type=sha,prefix=,format=short,enable=${{ matrix.rkllm == 'default' }}
            type=raw,value=rkllm-${{ matrix.rkllm }},enable=${{ github.ref == 'refs/heads/main' && matrix.rkllm != 'default' }}
            type=sha,prefix=,suffix=-rkllm-${{ matrix.rkllm }},format=short,enable=${{ matrix.rkllm != 'default' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          build-args: ${{ matrix.rkllm != 'default' && format('RKLLM_VERSION={0}', matrix.rkllm) || '' }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.rkllm }}
          cache-to: type=gha,mode=max,scope=${{ matrix.rkllm }}
